name: Bug report
description: Something shows wrong values, looks broken or crashes.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, what you expected, and the steps to get there. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: BetterActivityMonitor → About, or the release you downloaded.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      description: Sensor keys differ per model, so this matters for temperature, fan and GPU issues.
      placeholder: "MacBook Pro 14\" (M4 Pro)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash log or console output
      description: Optional. From Console.app → Crash Reports, or the terminal when run via `swift run`.
      render: text
