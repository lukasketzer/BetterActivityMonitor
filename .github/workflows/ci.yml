name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Liquid Glass (glassEffect) needs the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the build number counts commits

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build -c release

      # Timing budgets (SamplerPerformanceTests) and app-launch tests (AppPerformanceTests) are too noisy on
      # shared VMs; run them locally (see docs/CONTRIBUTING.md).
      - name: Unit tests
        run: swift test -c release --skip SamplerPerformanceTests --skip AppPerformanceTests

      # The SwiftPM bundle (used by the local profiling scripts) and the Xcode build with the desktop widgets.
      - name: Bundle app
        run: scripts/bundle.sh

      - name: Build app with widgets
        run: scripts/build-app.sh Release

      - uses: actions/upload-artifact@v4
        with:
          name: BetterActivityMonitor-${{ github.sha }}
          path: build/xcode/Release/BetterActivityMonitor.app
          retention-days: 7
