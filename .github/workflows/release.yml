name: Release

# Pushing a tag like v0.2.0 (made by scripts/release.sh) builds and publishes that release.
# A tag with a suffix, like v0.2.0-beta.1, becomes a pre-release.
# Optional secrets turn on Developer ID signing and notarization; without them the build is ad-hoc signed:
#   DEVELOPER_ID_CERT_P12      base64 of the "Developer ID Application" certificate exported as .p12
#   DEVELOPER_ID_CERT_PASSWORD password of that .p12
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD (app-specific password) for notarytool
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HAS_CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the build number counts commits

      - name: Version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The tag must match the project's version, so the app says what the release says.
          if [[ "${VERSION%%-*}" != "$(scripts/version.sh)" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $(scripts/version.sh). Use scripts/release.sh."
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "build=$(scripts/version.sh build)"
          } >> "$GITHUB_OUTPUT"
          echo "$VERSION (build $(scripts/version.sh build))"

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"

      - name: Test
        run: swift test -c release --skip SamplerPerformanceTests --skip AppPerformanceTests

      - name: Import Developer ID certificate
        id: cert
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        if: env.HAS_CERT == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application:[^"]*"' | head -1 | tr -d '"')"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          DEVELOPER_ID: ${{ steps.cert.outputs.identity }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: scripts/package.sh

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTARIZED: ${{ steps.cert.outputs.identity != '' && secrets.NOTARY_PASSWORD != '' }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          : > "$NOTES"
          SECTION="${VERSION%%-*}"
          # The docs/CHANGELOG.md section for this version, if there is one.
          awk -v v="$SECTION" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / && on {exit} on' docs/CHANGELOG.md >> "$NOTES"
          if [[ "$NOTARIZED" != "true" ]]; then
            cat >> "$NOTES" <<'EOF'

          > **First launch:** this build is not notarized. Right-click the app → **Open**, or run
          > `xattr -dr com.apple.quarantine /Applications/BetterActivityMonitor.app`.
          EOF
          fi
          cat "$NOTES"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          FLAGS=()
          [[ "$VERSION" == *-* ]] && FLAGS+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --title "BetterActivityMonitor $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${FLAGS[@]}" \
            "build/BetterActivityMonitor-$VERSION.dmg" "build/BetterActivityMonitor-$VERSION.zip" build/SHA256SUMS

      - name: Clean up keychain
        if: always() && steps.cert.outputs.identity != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
